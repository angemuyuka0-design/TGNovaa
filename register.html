<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGNOVA - Inscription</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/dashboard.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Loading Overlay -->
    <script src="js/loading-overlay.js"></script>
</head>
<body>
    <main class="auth-container">
        <!-- Section gauche - Bienvenue -->
        <section class="connexion_left">
            <div class="left">
                <h1>Bienvenue sur <span>TGNova</span></h1>
                <p>Une solution numérique moderne et efficace pour simplifier votre quotidien et accroître sa productivité.</p>
                <img src="images/image-tache-removebg-preview.png" alt="TGNova Illustration">
            </div>
        </section>

        <!-- Section droite - Inscription -->
        <section class="connexion_right">
            <div class="form_connexion">
                <div>
                    <h2>Inscription</h2>
                    <p>Créez votre compte TGNova.</p>
                </div>

                <!-- Formulaire d'inscription -->
                <form id="registerForm">
                    <!-- Nom complet -->
                    <div class="lab">
                        <label>Nom complet</label>
                        <div class="conteneur-champ">
                            <i class="fas fa-user icone-champ"></i>
                            <input type="text" class="champ-formulaire" id="name" placeholder="John Doe" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="lab">
                        <label>Adresse email</label>
                        <div class="conteneur-champ">
                            <i class="fas fa-envelope icone-champ"></i>
                            <input type="email" class="champ-formulaire" id="email" placeholder="votre@email.com" required>
                        </div>
                    </div>

                    <!-- Mot de passe -->
                    <div class="lab">
                        <label>Mot de passe</label>
                        <div class="conteneur-champ">
                            <i class="fas fa-lock icone-champ"></i>
                            <input type="password" class="champ-formulaire" id="password" placeholder="••••••••" required>
                            <button type="button" class="bouton-affichage-mdp" data-champ="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Conditions d'utilisation -->
                    <div class="lab">
                        <label class="case-se-souvenir">
                            <input type="checkbox" id="accepterConditions" required>
                            <span>
                                J'accepte les 
                                <a href="#" style="color: #4169E1; text-decoration: none;">conditions d'utilisation</a>
                                et la 
                                <a href="#" style="color: #4169E1; text-decoration: none;">politique de confidentialité</a>
                            </span>
                        </label>
                    </div>

                    <!-- Bouton d'inscription -->
                    <button type="submit" class="bouton-soumission" onclick="register()">
                        S'inscrire
                    </button>

                    <!-- Lien vers la connexion -->
                    <div class="lien-inscription">
                        Déjà membre ?
                        <a href="login.html">Se connecter</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
