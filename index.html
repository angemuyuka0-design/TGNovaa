<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGNOVA - Chargement</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="icon" type="image/png" href="../images/logo-removebg-preview.png">
    <link rel="stylesheet" href="css/accueil.css">
</head>
<body class="mode-sombre">
    <!-- Page de chargement -->
    <div class="page-chargement" id="pageChargement">
        <!-- Arrière-plan animé -->
        <div class="arriere-plan-anime">
            <div class="forme-geometrique"></div>
            <div class="forme-geometrique"></div>
            <div class="forme-geometrique"></div>
            <div class="forme-geometrique"></div>
        </div>

        <!-- Contenu du chargement -->
        <div class="contenu-chargement">
            <!-- Logo -->
            <div class="logo-chargement">
                <div class="cercle-chargement"></div>
                <img src="images/logo_DSC-removebg-preview.png" alt="TGNOVA" style="transform: rotate(270deg);">
            </div>

            <!-- Texte -->
            <h1 class="texte-chargement">TGNOVA</h1>
            <p class="sous-texte-chargement">
                Plateforme de gestion de projets moderne et intuitive
            </p>

            <!-- Barre de progression -->
            <div class="barre-progression-chargement">
                <div class="remplissage-progression"></div>
            </div>

            <!-- Statistiques -->
            <div class="statistiques-chargement">
                <div class="statistique">
                    <span class="valeur-statistique-chargement">99.9%</span>
                    <span class="libelle-statistique-chargement">Disponibilité</span>
                </div>
                <div class="statistique">
                    <span class="valeur-statistique-chargement">5s</span>
                    <span class="libelle-statistique-chargement">Temps de réponse</span>
                </div>
                <div class="statistique">
                    <span class="valeur-statistique-chargement">10k+</span>
                    <span class="libelle-statistique-chargement">Utilisateurs</span>
                </div>
            </div>
        </div>

        <!-- Message de bienvenue -->
        <div class="message-bienvenue">
            © 2025 TGNOVA • Gestion de projets intelligente
        </div>
    </div>

    <script src="js/accueil.js"></script>
</body>
</html>
