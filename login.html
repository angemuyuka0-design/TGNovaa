<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGNOVA - Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" type="image/png" href="images/logo-removebg-preview.png">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Loading Overlay -->
    <script src="js/loading-overlay.js"></script>
</head>
<body>
    <main class="auth-container">
        <!-- Section gauche - Bienvenue -->
        <section class="connexion_left">
            <div class="left">
                <h1>Bienvenue sur <span>TGNova</span></h1>
                <p>Une solution numérique moderne et efficace pour simplifier votre quotidien et accroître la productivité.</p>
                <img src="images/image-tache-removebg-preview.png" alt="TGNova Illustration">
            </div>
        </section>

        <!-- Section droite - Connexion -->
        <section class="connexion_right">
            <div class="form_connexion">
                <div>
                    <h2>Connexion</h2>
                    <p>Connectez-vous à votre compte.</p>
                </div>

                <!-- Formulaire de connexion -->
                <form id="loginForm">
                    <!-- Email -->
                    <div class="lab">
                        <label>Adresse email</label>
                        <div class="conteneur-champ">
                            <i class="fas fa-envelope icone-champ"></i>
                            <input type="email" class="champ-formulaire" id="email" placeholder="votre@email.com" required>
                        </div>
                    </div>

                    <!-- Mot de passe -->
                    <div class="lab">
                        <label>Mot de passe</label>
                        <div class="conteneur-champ">
                            <i class="fas fa-lock icone-champ"></i>
                            <input type="password" class="champ-formulaire" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="options-supplementaires">
                        <label class="case-se-souvenir">
                            <input type="checkbox" id="seSouvenir">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#" class="lien-mot-de-passe-oublie" id="lienMdpOublie" onclick="loginWithGoogle()">
                            Mot de passe oublié ?
                        </a>
                    </div>

                    <!-- Bouton de connexion -->
                    <button type="button" class="bouton-soumission" onclick="login()">
                        Se connecter
                    </button>

                    <!-- Séparateur -->
                    <div class="separateur">
                        <span>Ou continuer avec</span>
                    </div>

                    <!-- Connexion sociale -->
                    <div class="connexion-sociale">
                        <button type="button" class="bouton-social" id="boutonGoogle" onclick="loginWithGoogle()">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                        <button type="button" class="bouton-social" id="boutonGithub" onclick="loginWithGithub()">
                            <i class="fab fa-github"></i>
                            Github
                        </button>
                    </div>

                    <!-- Lien vers l'inscription -->
                    <div class="lien-inscription">
                        Pas encore membre ?
                        <a href="register.html">Créer un compte</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
